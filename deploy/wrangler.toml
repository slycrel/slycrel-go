name = "slycrel"
main = "src/index.js"
compatibility_date = "2026-05-08"

# The Go server holds all game state in memory + JSON files at /state.
# Until the store moves to R2/D1 (phase 4), we MUST keep this at 1 so that
# all players share the same instance and the same state. Setting it higher
# would silently fork the game into parallel universes per container.
[[containers]]
class_name = "SlycrelServer"
image = "../Dockerfile"
max_instances = 1

[[durable_objects.bindings]]
name = "SLYCREL"
class_name = "SlycrelServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SlycrelServer"]
